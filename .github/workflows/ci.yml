name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tourflow
          POSTGRES_PASSWORD: tourflow
          POSTGRES_DB: tourflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tourflow"
          --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://tourflow:tourflow@localhost:5432/tourflow
      NUXT_APP_SECRET: Y2ktYXBwLXNlY3JldC1mb3ItdGVzdHMtb25seS0wMDAwMDA=
      PII_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec prisma migrate deploy
      - run: pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
