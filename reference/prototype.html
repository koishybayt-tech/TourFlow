<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tourflow — интерактивный прототип CRM для турагентств</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F7F8}
@media print{aside,header,.noprint{display:none!important}main{flex:1 1 100%!important}}
a{color:#4F46E5}a:hover{color:#4338CA}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.ic-s{width:15px;height:15px}
.num{font-variant-numeric:tabular-nums}
.card{background:#FFFFFF;border:1px solid #E6E7EA;border-radius:12px;box-sizing:border-box}
.cp{padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:8px;border:1px solid #DCDEE3;background:#FFFFFF;color:#0F1115;font:500 13.5px Inter,system-ui,sans-serif;cursor:pointer;white-space:nowrap;box-sizing:border-box;box-shadow:0 1px 2px rgba(16,24,40,0.05)}
.btn:hover{background:#F7F7F8}
.btn-p{background:#4F46E5;border-color:#4F46E5;color:#FFFFFF}
.btn-p:hover{background:#4338CA}
.btn-g{border-color:transparent;background:transparent;box-shadow:none}
.btn-g:hover{background:#F2F3F5}
.btn-d{color:#B42318}
.btn-sm{height:30px;padding:0 10px;font-size:12.5px;gap:6px}
.btn-ico{width:36px;padding:0}
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap;box-sizing:border-box}
.dot{width:6px;height:6px;border-radius:3px;display:inline-block;flex:0 0 auto}
.h1{font-size:20px;font-weight:600;letter-spacing:-0.015em;margin:0;color:#0F1115}
.h2{font-size:14px;font-weight:600;margin:0;color:#0F1115}
.sub{font-size:13px;color:#5A606B;margin:0;line-height:1.5}
.cap{font-size:12px;color:#5A606B}
.lbl{font-size:12px;font-weight:500;color:#5A606B}
.inp{height:36px;border:1px solid #DCDEE3;border-radius:8px;padding:0 12px;font:400 13.5px Inter,system-ui,sans-serif;box-sizing:border-box;background:#FFFFFF;color:#0F1115;width:100%}
.inp::placeholder{color:#7A808A}
.nav{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;border:0;border-radius:8px;font:500 13.5px Inter,system-ui,sans-serif;cursor:pointer;text-align:left;box-sizing:border-box}
.nav:hover{background:#F0F1F3}
.navsec{font-size:11px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:#6B7180;padding:14px 10px 6px}
.th{display:grid;background:#F9FAFB;border-bottom:1px solid #E6E7EA}
.th>div{padding:9px 16px;font-size:12px;font-weight:500;color:#5A606B;white-space:nowrap}
.tr{display:grid;align-items:center;border-bottom:1px solid #F0F1F3;font-size:13.5px}
.tr>div{padding:14px 16px;min-width:0}
.tr:hover{background:#FAFAFB}
.stp{position:relative;flex:1;height:14px;display:flex;align-items:center;cursor:default}
.stp>i{display:block;width:100%;height:4px;border-radius:2px;transition:height .12s}
.stp:hover>i{height:6px}
.stp::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);background:#0F1115;color:#FFFFFF;font:500 12px Inter,system-ui,sans-serif;line-height:1.35;padding:6px 9px;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;z-index:30;box-shadow:0 6px 16px rgba(16,24,40,0.2)}
.stp::before{content:'';position:absolute;left:50%;bottom:calc(100% + 1px);transform:translateX(-50%);border:5px solid transparent;border-top-color:#0F1115;border-bottom:0;opacity:0;transition:opacity .12s;z-index:30}
.stp:hover::after,.stp:hover::before{opacity:1}
.tab{height:42px;padding:0;margin-right:24px;border:0;background:none;font:500 13.5px Inter,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.segw{display:inline-flex;gap:2px;padding:3px;background:#EFF0F2;border-radius:9px;flex-wrap:wrap}
.seg{height:28px;padding:0 12px;border:0;border-radius:6px;font:500 13px Inter,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.kcard{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left;background:#FFFFFF;border:1px solid #E6E7EA;border-radius:10px;padding:12px;cursor:pointer;font-family:Inter,system-ui,sans-serif;color:#0F1115;box-sizing:border-box;box-shadow:0 1px 2px rgba(16,24,40,0.04)}
.kcard:hover{border-color:#B4B9F5;box-shadow:0 2px 6px rgba(16,24,40,0.08)}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:8px;cursor:pointer;font-family:Inter,system-ui,sans-serif;color:#0F1115;box-sizing:border-box}
.row:hover{background:#F5F6F8}
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:600;flex:0 0 auto}
.lnk{background:none;border:0;padding:0;color:#4F46E5;font:500 13.5px Inter,system-ui,sans-serif;cursor:pointer;text-align:left}
.lnk:hover{text-decoration:underline}
.field{display:flex;flex-direction:column;gap:4px}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px;font-size:13.5px;padding:6px 0}
.kv>span:first-child{color:#5A606B}
.sr{position:absolute;left:-9999px}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #4F46E5;outline-offset:2px}
</style>

</head>
<body>
<div id="tf-root"></div>
<script type="text/plain" id="tf-tpl">
<sc-if value="{{notAuthed}}" hint-placeholder-val="{{ false }}">
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #FFFFFF; font-family: Inter, system-ui, sans-serif; color: #0F1115; font-size: 13.5px">
<div style="flex: 1 1 440px; background: #1E1B4B; color: #FFFFFF; padding: 48px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: 40px">
<div style="display: flex; align-items: center; gap: 10px"><div style="width: 34px; height: 34px; border-radius: 9px; background: #6172F3; display: flex; align-items: center; justify-content: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: #FFFFFF"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"></path></svg></div><span style="font-weight: 600; font-size: 17px">Tourflow</span></div>
<div style="max-width: 460px"><h1 style="font-size: 32px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; margin: 0">CRM для турагентств — от заявки в WhatsApp до вылета группы</h1>
<div style="display: flex; flex-direction: column; gap: 12px; margin-top: 28px; font-size: 15px; color: #E0E7FF">
<div style="display: flex; gap: 10px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: #A4BCFD; margin-top: 1px"><path d="M20 6 9 17l-5-5"></path></svg>Сообщения WhatsApp и Instagram в одной ленте</div>
<div style="display: flex; gap: 10px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: #A4BCFD; margin-top: 1px"><path d="M20 6 9 17l-5-5"></path></svg>Набор групп, визы, оплаты и брони без Excel</div>
<div style="display: flex; gap: 10px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: #A4BCFD; margin-top: 1px"><path d="M20 6 9 17l-5-5"></path></svg>Воронки и поля настраиваются без разработчика</div>
</div></div>
<div style="font-size: 13px; color: #C7D2FE">© 2026 Tourflow · Данные клиентов хранятся в Казахстане</div>
</div>
<div style="flex: 1 1 440px; display: flex; align-items: center; justify-content: center; padding: 48px 24px; box-sizing: border-box">
<div style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 18px">
<sc-if value="{{authLogin}}" hint-placeholder-val="{{ true }}">
<div><h1 class="h1" style="font-size: 24px">Вход в аккаунт</h1><p class="sub" style="margin-top: 6px">Войдите, чтобы продолжить работу с агентством</p></div>
<sc-if value="{{lmIsPass}}" hint-placeholder-val="{{ true }}">
<label class="field"><span class="lbl">Email или телефон</span><input class="inp" style="height: 40px" value="{{lg.email}}" onChange="{{lgf.email}}" autocomplete="username"></label>
<label class="field"><span style="display: flex; justify-content: space-between"><span class="lbl">Пароль</span><button class="lnk" style="font-size: 12.5px" onClick="{{toForgot}}">Забыли пароль?</button></span><input class="inp" style="height: 40px" type="password" value="{{lg.password}}" onChange="{{lgf.password}}" autocomplete="current-password"></label>
<label style="display: flex; gap: 8px; align-items: center"><input type="checkbox" checked style="width: 16px; height: 16px; accent-color: #4F46E5"> Запомнить это устройство</label>
</sc-if>

<sc-if value="{{hasLgErr}}" hint-placeholder-val="{{ false }}"><div class="badge" style="height: auto; padding: 10px 12px; white-space: normal; line-height: 1.45; background: #FEF3F2; color: #B42318">{{lgErr}}</div></sc-if>
<button class="btn btn-p" style="height: 42px; width: 100%" onClick="{{loginCta}}">{{loginLabel}}</button>
<div class="cap" style="padding: 12px; border-radius: 8px; background: #F9FAFB; line-height: 1.5">Демо: данные владельца уже заполнены. Чтобы войти менеджером, укажите ayagoz@demo.travel.</div>
<div style="text-align: center; font-size: 13.5px">Нет аккаунта? <button class="lnk" onClick="{{toSignup}}">Зарегистрировать агентство</button></div>
</sc-if>
<sc-if value="{{authForgot}}" hint-placeholder-val="{{ false }}">
<div><h1 class="h1" style="font-size: 24px">Восстановление пароля</h1><p class="sub" style="margin-top: 6px">Пришлём ссылку для нового пароля на email или в WhatsApp</p></div>
<label class="field"><span class="lbl">Email или телефон</span><input class="inp" style="height: 40px" value="{{lg.email}}" onChange="{{lgf.email}}"></label>
<sc-if value="{{hasLgErr}}" hint-placeholder-val="{{ false }}"><div class="badge" style="height: auto; padding: 10px 12px; white-space: normal; background: #FEF3F2; color: #B42318">{{lgErr}}</div></sc-if>
<button class="btn btn-p" style="height: 42px; width: 100%" onClick="{{sendReset}}">Отправить ссылку</button>
<button class="lnk" style="align-self: center" onClick="{{toLogin}}">← Вернуться ко входу</button>
</sc-if>
<sc-if value="{{authSignup}}" hint-placeholder-val="{{ false }}">
<div><h1 class="h1" style="font-size: 24px">Регистрация агентства</h1><p class="sub" style="margin-top: 6px">Создайте аккаунт — сотрудников пригласите позже</p></div>
<label class="field"><span class="lbl">Название агентства</span><input class="inp" value="{{lg.agency}}" onChange="{{lgf.agency}}"></label>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px"><label class="field"><span class="lbl">БИН / ИИН</span><input class="inp num" inputmode="numeric" maxlength="12" value="{{lg.bin}}" onChange="{{lgf.bin}}" placeholder="12 цифр"></label><label class="field"><span class="lbl">Город</span><input class="inp" value="{{lg.city}}" onChange="{{lgf.city}}"></label></div>
<label class="field"><span class="lbl">Ваше имя</span><input class="inp" value="{{lg.owner}}" onChange="{{lgf.owner}}"></label>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px"><label class="field"><span class="lbl">Телефон</span><input class="inp num" value="{{lg.sPhone}}" onChange="{{lgf.sPhone}}" placeholder="+7"></label><label class="field"><span class="lbl">Email</span><input class="inp" value="{{lg.sEmail}}" onChange="{{lgf.sEmail}}"></label></div>
<label class="field"><span class="lbl">Пароль</span><input class="inp" type="password" value="{{lg.sPass}}" onChange="{{lgf.sPass}}" placeholder="Минимум 8 символов и цифра"></label>
<label style="display: flex; gap: 8px; align-items: flex-start; line-height: 1.45"><input type="checkbox" checked="{{lgConsent}}" onChange="{{toggleConsent}}" style="width: 16px; height: 16px; margin-top: 2px; accent-color: #4F46E5"> Согласен на обработку персональных данных и с условиями использования</label>
<sc-if value="{{hasLgErr}}" hint-placeholder-val="{{ false }}"><div class="badge" style="height: auto; padding: 10px 12px; white-space: normal; line-height: 1.45; background: #FEF3F2; color: #B42318">{{lgErr}}</div></sc-if>
<button class="btn btn-p" style="height: 42px; width: 100%" onClick="{{signup}}">Создать аккаунт</button>
<button class="lnk" style="align-self: center" onClick="{{toLogin}}">← У меня уже есть аккаунт</button>
</sc-if>
</div>
</div>
<sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}"><div role="status" style="position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px; max-width: 480px; width: calc(100% - 32px); box-sizing: border-box; background: #0F1115; color: #FFFFFF; padding: 12px 16px; border-radius: 10px; font-size: 13.5px; z-index: 60">{{toast}}</div></sc-if>
</div>
</sc-if>

<sc-if value="{{authed}}" hint-placeholder-val="{{ true }}">
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; align-items: stretch; background: #F7F7F8; font-family: Inter, system-ui, sans-serif; color: #0F1115; font-size: 13.5px">

<aside style="flex: 1 1 248px; max-width: 100%; background: #FBFBFC; border-right: 1px solid #E6E7EA; padding: 14px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 10px; padding: 6px 8px 14px">
<div style="width: 30px; height: 30px; border-radius: 8px; background: #4F46E5; display: flex; align-items: center; justify-content: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: #FFFFFF; width: 16px; height: 16px"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"></path></svg></div>
<div style="min-width: 0"><div style="font-weight: 600; font-size: 14px">Demo Travel</div><div class="cap">Tourflow · Алматы</div></div>
</div>
<nav aria-label="Основное меню" style="display: flex; flex-direction: column; gap: 2px">
<button class="nav" style="{{nv.dashboard}}" onClick="{{go.dashboard}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M9 22V12h6v10"></path></svg>Главная</button>
<button class="nav" style="{{nv.inbox}}" onClick="{{go.inbox}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg><span style="flex: 1">Сообщения</span><sc-if value="{{hasUnread}}" hint-placeholder-val="{{ true }}"><span class="badge num" style="background: #4F46E5; color: #FFFFFF; height: 20px; padding: 0 7px">{{unread}}</span></sc-if></button>
<button class="nav" style="{{nv.deals}}" onClick="{{go.deals}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M8 7v7M12 7v4M16 7v9"></path></svg>Заявки</button>
<button class="nav" style="{{nv.tasks}}" onClick="{{go.tasks}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 11 3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg><span style="flex: 1">Задачи</span><sc-if value="{{hasOverdue}}" hint-placeholder-val="{{ false }}"><span class="badge num" style="background: #FEE4E2; color: #B42318; height: 20px; padding: 0 7px">{{overdueCount}}</span></sc-if></button>
<button class="nav" style="{{nv.calendar}}" onClick="{{go.calendar}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>Календарь</button>
<button class="nav" style="{{nv.clients}}" onClick="{{go.clients}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg>Клиенты</button>

<sc-if value="{{isOwner}}" hint-placeholder-val="{{ true }}"><button class="nav" style="{{nv.reports}}" onClick="{{go.reports}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"></path><path d="M7 15l4-4 3 3 5-6"></path></svg>Отчёты</button></sc-if>
<sc-if value="{{ticketsOn}}" hint-placeholder-val="{{ true }}"><button class="nav" style="{{nv.tickets}}" onClick="{{go.tickets}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 16l20-8-4 10-6-3-3 4-1-5z"></path></svg>Авиабилеты и отели</button></sc-if>
<sc-if value="{{groupOn}}" hint-placeholder-val="{{ true }}">
<div class="navsec">Групповые туры</div>
<button class="nav" style="{{nv.atours}}" onClick="{{go.atours}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18M3 12h18M3 17h12"></path></svg>Мои туры</button>
<button class="nav" style="{{nv.departures}}" onClick="{{go.departures}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"></path></svg><span style="flex: 1">Выезды</span><sc-if value="{{hasRisk}}" hint-placeholder-val="{{ true }}"><span class="badge num" style="background: #FEF0C7; color: #B54708; height: 20px; padding: 0 7px">{{riskCount}}</span></sc-if></button>
<button class="nav" style="{{nv.guides}}" onClick="{{go.guides}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><path d="M4 22v-7"></path></svg>Гиды</button>
</sc-if>
<sc-if value="{{packageOn}}" hint-placeholder-val="{{ false }}">
<div class="navsec">Пакетные туры</div>
<button class="nav" style="{{nv.tsearch}}" onClick="{{go.tsearch}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>Поиск туров</button>
<button class="nav" style="{{nv.packages}}" onClick="{{go.packages}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path><path d="m3.3 7 8.7 5 8.7-5M12 22V12"></path></svg>Брони у туроператоров</button>
</sc-if>
<sc-if value="{{teamNav}}" hint-placeholder-val="{{ false }}">
<div class="navsec">Команда</div>
<button class="nav" style="{{nv.team}}" onClick="{{go.team}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="3"></circle><circle cx="18" cy="18" r="3"></circle><path d="M6 9v3a3 3 0 0 0 3 3h6"></path></svg>Распределение</button>
</sc-if>
<sc-if value="{{migNav}}" hint-placeholder-val="{{ false }}">
<div class="navsec">Миграция</div>
<button class="nav" style="{{nv.migration}}" onClick="{{go.migration}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="m7 10 5 5 5-5M12 15V3"></path></svg>Импорт из Битрикс24</button>
</sc-if>
<sc-if value="{{isOwner}}" hint-placeholder-val="{{ true }}">
<div class="navsec">Система</div>
<button class="nav" style="{{nv.settings}}" onClick="{{go.settings}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>Настройки</button>
</sc-if>
</nav>
<div style="margin-top: auto; padding-top: 16px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 6px; padding: 8px; border: 1px solid #E6E7EA; border-radius: 10px; background: #FFFFFF">
<button class="row" style="padding: 4px; flex: 1; min-width: 0" onClick="{{go.profile}}"><span class="av" style="width: 30px; height: 30px; background: #E0E7FF; color: #3538CD; font-size: 12px">{{me.initials}}</span><span style="min-width: 0"><span style="display: block; font-weight: 600; font-size: 13px">{{me.fullName}}</span><span class="cap">{{me.role}}</span></span></button>
<button class="btn btn-g btn-ico" style="width: 32px; height: 32px" aria-label="Выйти" onClick="{{logout}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg></button>
</div>
<div class="segw" style="width: 100%; box-sizing: border-box"><button class="seg" style="flex: 1; {{roleOwnerStyle}}" onClick="{{asOwner}}">Владелец</button><button class="seg" style="flex: 1; {{roleMgrStyle}}" onClick="{{asManager}}">Менеджер</button></div>
<div class="cap" style="text-align: center">Демо: просмотр от лица роли</div>
</div>
</aside>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<header style="height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 28px; border-bottom: 1px solid #E6E7EA; background: #FFFFFF; box-sizing: border-box; flex-wrap: wrap">
<div style="position: relative; flex: 1 1 280px; max-width: 520px">
<label><span class="sr">Глобальный поиск</span>
<span style="position: absolute; left: 11px; top: 9px; color: #7A808A; display: flex"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg></span>
<input class="inp" style="padding-left: 36px; background: #F7F7F8; border-color: #ECEDF0" value="{{search}}" onChange="{{onSearch}}" placeholder="Поиск клиентов, телефонов, заявок, выездов"></label>
<sc-if value="{{hasSearch}}" hint-placeholder-val="{{ false }}">
<div class="card" style="position: absolute; left: 0; right: 0; top: 42px; z-index: 40; padding: 6px; box-shadow: 0 12px 32px rgba(16,24,40,0.14)">
<sc-for list="{{searchRes}}" as="r" hint-placeholder-count="3"><button class="row" onClick="{{r.open}}"><span class="badge" style="background: #F2F3F5; color: #3A3F48; min-width: 64px; justify-content: center">{{r.kind}}</span><span style="flex: 1; min-width: 0"><span style="display: block; font-weight: 500">{{r.title}}</span><span class="cap">{{r.sub}}</span></span></button></sc-for>
<sc-if value="{{noSearchRes}}" hint-placeholder-val="{{ false }}"><div class="cap" style="padding: 12px">Ничего не найдено. Попробуйте имя, телефон или направление.</div></sc-if>
</div>
</sc-if>
</div>
<div style="margin-left: auto; display: flex; align-items: center; gap: 8px">
<div style="position: relative">
<button class="btn btn-g btn-ico" aria-label="Уведомления" onClick="{{toggleNotif}}" style="position: relative"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg><sc-if value="{{hasNotif}}" hint-placeholder-val="{{ true }}"><span style="position: absolute; top: 7px; right: 8px; width: 8px; height: 8px; border-radius: 4px; background: #F04438; border: 2px solid #FFFFFF"></span></sc-if></button>
<sc-if value="{{notifOpen}}" hint-placeholder-val="{{ false }}">
<div class="card" style="position: absolute; right: 0; top: 44px; width: 360px; max-width: 86vw; z-index: 40; box-shadow: 0 12px 32px rgba(16,24,40,0.14)">
<div style="padding: 14px 16px; border-bottom: 1px solid #F0F1F3; display: flex; justify-content: space-between; align-items: center"><span class="h2">Уведомления</span><span class="cap">Дублируются в Telegram</span></div>
<div style="padding: 6px">
<sc-for list="{{notifs}}" as="n" hint-placeholder-count="4"><button class="row" style="align-items: flex-start" onClick="{{n.open}}"><span class="dot" style="margin-top: 6px; {{n.dot}}"></span><span style="flex: 1"><span style="display: block; font-weight: 500; line-height: 1.4">{{n.title}}</span><span class="cap">{{n.sub}}</span></span></button></sc-for>
</div>
</div>
</sc-if>
</div>
<div style="position: relative">
<button class="btn btn-g" style="padding: 0 8px 0 4px; gap: 10px; height: 44px" aria-label="Меню профиля" onClick="{{toggleUserMenu}}"><span class="av" style="width: 32px; height: 32px; font-size: 12px; background: #E0E7FF; color: #3538CD">{{me.initials}}</span><span style="display: flex; flex-direction: column; align-items: flex-start; line-height: 1.25; text-align: left"><span style="font-weight: 600; font-size: 13.5px">{{me.fullName}}</span><span style="font-size: 12px; color: #5A606B; font-weight: 400">{{me.email}}</span></span><svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
<sc-if value="{{userMenu}}" hint-placeholder-val="{{ false }}">
<div class="card" style="position: absolute; right: 0; top: 50px; width: 270px; z-index: 40; padding: 6px; box-shadow: 0 12px 32px rgba(16,24,40,0.14)">
<div style="padding: 10px 12px 12px; border-bottom: 1px solid #F0F1F3; margin-bottom: 4px"><div style="font-weight: 600">{{me.fullName}}</div><div class="cap">{{me.email}}</div><span class="badge" style="margin-top: 8px; background: #F2F3F5; color: #3A3F48">{{me.role}} · Demo Travel</span></div>
<button class="row" onClick="{{go.profile}}">Личный кабинет</button>
<sc-if value="{{isOwner}}" hint-placeholder-val="{{ true }}"><button class="row" onClick="{{goSettingsUsers}}">Сотрудники и доступ</button></sc-if>
<button class="row" onClick="{{switchRole}}">{{switchRoleLabel}}</button>
<div style="border-top: 1px solid #F0F1F3; margin: 4px 0"></div>
<button class="row" style="color: #B42318" onClick="{{logout}}">Выйти</button>
</div>
</sc-if>
</div>
</div>
</header>

<div style="padding: 24px 28px 64px; display: flex; flex-direction: column; gap: 20px; box-sizing: border-box; width: 100%">

<sc-if value="{{isDash}}" hint-placeholder-val="{{ true }}">
<section style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap">
<div><h1 class="h1">Добрый день, {{me.first}}</h1><p class="sub" style="margin-top: 4px">Четверг, 22 октября</p></div>
<div style="display: flex; gap: 8px; flex-wrap: wrap"><button class="btn" onClick="{{openNewTask}}">+ Задача</button><button class="btn btn-p" onClick="{{newDeal}}"><svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Новая заявка</button></div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px"><sc-for list="{{focus}}" as="fc" hint-placeholder-count="4"><button class="card" style="padding: 16px 18px; text-align: left; cursor: pointer; font-family: Inter, system-ui, sans-serif; color: #0F1115; display: flex; gap: 14px; align-items: center" onClick="{{fc.open}}"><span class="num" style="font-size: 28px; font-weight: 600; min-width: 36px; {{fc.numStyle}}">{{fc.n}}</span><span><span style="display: block; font-weight: 600">{{fc.title}}</span><span class="cap">{{fc.sub}}</span></span></button></sc-for></div>
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<div class="card"><div style="padding: 14px 18px; border-bottom: 1px solid #F0F1F3; display: flex; justify-content: space-between; align-items: center"><span class="h2">Мои задачи на сегодня</span><button class="lnk" style="font-size: 13px" onClick="{{go.tasks}}">Все задачи</button></div><div style="padding: 6px 8px"><sc-for list="{{todayTasks}}" as="t" hint-placeholder-count="4"><div style="display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px"><button aria-label="{{t.boxAria}}" style="{{t.box}}" onClick="{{t.toggle}}"><sc-if value="{{t.done}}" hint-placeholder-val="{{ false }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 12px; height: 12px; color: #FFFFFF; stroke-width: 3"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></button><div style="flex: 1; min-width: 0"><button class="lnk" style="color: #0F1115; font-weight: 500; text-align: left" onClick="{{t.openTask}}">{{t.text}}</button><div style="display: flex; gap: 8px; align-items: center; margin-top: 4px; flex-wrap: wrap"><span class="badge num" style="{{t.dueStyle}}">{{t.due}}</span><sc-if value="{{t.hasLink}}" hint-placeholder-val="{{ false }}"><button class="lnk" style="font-size: 12px" onClick="{{t.open}}">{{t.linkLabel}}</button></sc-if></div></div></div></sc-for><sc-if value="{{noTodayTasks}}" hint-placeholder-val="{{ false }}"><div class="cap" style="padding: 12px">На сегодня задач нет.</div></sc-if></div></div><div class="card"><div style="padding: 14px 18px; border-bottom: 1px solid #F0F1F3; display: flex; justify-content: space-between; align-items: center"><span class="h2">Ждут ответа</span><button class="lnk" style="font-size: 13px" onClick="{{go.inbox}}">Все сообщения</button></div><div style="padding: 6px 8px"><sc-for list="{{unreadConvs}}" as="c" hint-placeholder-count="2"><button class="row" style="align-items: flex-start" onClick="{{c.open}}"><span class="av" style="width: 32px; height: 32px; font-size: 12px; {{c.avStyle}}">{{c.initials}}</span><span style="flex: 1; min-width: 0"><span style="display: flex; justify-content: space-between; gap: 8px"><strong style="font-weight: 600">{{c.name}}</strong><span class="cap num">{{c.time}}</span></span><span class="cap" style="display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.preview}}</span></span></button></sc-for><sc-if value="{{noUnread}}" hint-placeholder-val="{{ false }}"><div class="cap" style="padding: 12px">Все сообщения обработаны.</div></sc-if></div></div>
</div>
<div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<div class="card"><div style="padding: 14px 18px; border-bottom: 1px solid #F0F1F3; display: flex; justify-content: space-between; align-items: center"><span class="h2">Сегодня в календаре</span><button class="lnk" style="font-size: 13px" onClick="{{go.calendar}}">Календарь</button></div><div style="padding: 6px 8px"><sc-for list="{{todayEvents}}" as="dl" hint-placeholder-count="2"><button class="row" style="align-items: flex-start; {{dl.style}}" onClick="{{dl.pick}}"><span class="num cap" style="width: 62px; flex: 0 0 62px; padding-top: 1px">{{dl.time}}</span><span class="dot" style="margin-top: 6px; {{dl.dot}}"></span><span style="flex: 1; min-width: 0"><span style="display: block; font-weight: 500; line-height: 1.4">{{dl.title}}</span><span class="cap">{{dl.typeLabel}}</span></span></button></sc-for><sc-if value="{{noTodayEvents}}" hint-placeholder-val="{{ false }}"><div class="cap" style="padding: 12px">Встреч и записей нет.</div></sc-if></div></div><div class="card"><div style="padding: 14px 18px; border-bottom: 1px solid #F0F1F3; display: flex; justify-content: space-between; align-items: center"><span class="h2">Оплаты и вылеты на неделе</span></div><div style="padding: 6px 8px"><sc-for list="{{weekItems}}" as="wi2" hint-placeholder-count="3"><button class="row" style="align-items: flex-start" onClick="{{wi2.open}}"><span class="badge" style="{{wi2.style}}; min-width: 74px; justify-content: center">{{wi2.kind}}</span><span style="flex: 1; min-width: 0"><span style="display: block; font-weight: 500">{{wi2.title}}</span><span class="cap">{{wi2.sub}}</span></span><span class="num" style="font-weight: 600; white-space: nowrap">{{wi2.amount}}</span></button></sc-for><sc-if value="{{noWeek}}" hint-placeholder-val="{{ false }}"><div class="cap" style="padding: 12px">На этой неделе срочных оплат и вылетов нет.</div></sc-if></div></div>
</div>
</div>
</section>
</sc-if>

<sc-if value="{{isInbox}}" hint-placeholder-val="{{ false }}">
<section style="display: flex; flex-direction: column; gap: 16px">
<div><h1 class="h1">Сообщения</h1><p class="sub" style="margin-top: 4px">WhatsApp Business и Instagram в одной ленте. Ответ уходит в тот канал, откуда написал клиент.</p></div>
<div class="card" style="display: flex; flex-wrap: wrap; min-height: max(640px, calc(100vh - 200px)); overflow: hidden">
<div style="flex: 1 1 290px; max-width: 100%; border-right: 1px solid #E6E7EA; display: flex; flex-direction: column">
<div style="padding: 12px; border-bottom: 1px solid #F0F1F3"><div class="segw" style="width: 100%; box-sizing: border-box"><sc-for list="{{inboxTabs}}" as="it" hint-placeholder-count="4"><button class="seg" style="flex: 1; {{it.style}}" onClick="{{it.pick}}">{{it.label}}</button></sc-for></div></div>
<div style="padding: 6px; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{convList}}" as="c" hint-placeholder-count="5">
<button class="row" style="align-items: flex-start; {{c.style}}" onClick="{{c.open}}">
<span class="av" style="width: 36px; height: 36px; font-size: 13px; {{c.avStyle}}">{{c.initials}}</span>
<span style="flex: 1; min-width: 0">
<span style="display: flex; justify-content: space-between; gap: 6px; align-items: center"><span style="font-weight: 600; {{c.nameStyle}}">{{c.name}}</span><span class="cap num">{{c.time}}</span></span>
<span class="cap" style="display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px">{{c.preview}}</span>
<span style="display: flex; gap: 6px; margin-top: 6px"><span class="badge" style="{{c.srcStyle}}">{{c.src}}</span><sc-if value="{{c.unread}}" hint-placeholder-val="{{ false }}"><span class="badge" style="background: #4F46E5; color: #FFFFFF">Новое</span></sc-if><sc-if value="{{c.hasDeal}}" hint-placeholder-val="{{ false }}"><span class="badge" style="background: #F2F3F5; color: #3A3F48">Есть заявка</span></sc-if><sc-if value="{{c.hasSug}}" hint-placeholder-val="{{ false }}"><span class="badge" style="{{c.sugStyle}}">→ {{c.sugLabel}}</span></sc-if></span>
</span>
</button>
</sc-for>
<sc-if value="{{noConvs}}" hint-placeholder-val="{{ false }}"><div class="cap" style="padding: 16px">В этом фильтре диалогов нет.</div></sc-if>
</div>
</div>
<div style="flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column">
<div style="display: flex; gap: 12px; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1px solid #F0F1F3; flex-wrap: wrap">
<div style="display: flex; gap: 10px; align-items: center"><span class="av" style="width: 36px; height: 36px; font-size: 13px; {{conv.avStyle}}">{{conv.initials}}</span><div><div style="font-weight: 600; font-size: 14px">{{conv.name}}</div><div class="cap num">{{conv.phone}} · {{conv.src}}</div></div></div>
<div style="display: flex; gap: 8px">
<sc-if value="{{conv.hasDeal}}" hint-placeholder-val="{{ false }}"><button class="btn btn-sm" onClick="{{conv.openDeal}}">Открыть заявку</button></sc-if>
<sc-if value="{{conv.noDeal}}" hint-placeholder-val="{{ true }}"><button class="btn btn-sm btn-p" onClick="{{conv.createDeal}}">Создать заявку из диалога</button></sc-if>
</div>
</div>
<sc-if value="{{conv.noDeal}}" hint-placeholder-val="{{ true }}"><div style="padding: 10px 20px; border-bottom: 1px solid #F0F1F3; background: #FCFCFD; display: flex; gap: 12px; align-items: center; flex-wrap: wrap">
<svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true" style="color: #6172F3"><path d="M12 3l1.9 5.8L20 10l-5 3.6L16.5 20 12 16.5 7.5 20 9 13.6 4 10l6.1-1.2z"></path></svg>
<div style="flex: 1 1 280px; min-width: 0; font-size: 13px; line-height: 1.45"><sc-if value="{{convRoute.isQueue}}" hint-placeholder-val="{{ false }}"><span style="color: #B54708">Воронку определить не удалось — выберите вручную</span></sc-if><sc-if value="{{convRoute.notQueue}}" hint-placeholder-val="{{ true }}"><span class="cap">Рекомендация:</span> <strong style="font-weight: 600">{{convRoute.pipeLabel}}</strong> <span class="cap">· {{convRoute.how}}<sc-if value="{{convRoute.hasConf}}" hint-placeholder-val="{{ true }}"> · {{convRoute.conf}}</sc-if><sc-if value="{{convRoute.hasDepRec}}" hint-placeholder-val="{{ false }}"> · выезд «{{convRoute.depName}}»</sc-if></span></sc-if></div>
<sc-if value="{{convDir.has}}" hint-placeholder-val="{{ true }}"><span class="badge" style="background: #F2F3F5; color: #3A3F48">Направление: {{convDir.text}}</span></sc-if>
<label style="display: flex; gap: 8px; align-items: center; flex: 0 0 auto"><span class="lbl">Воронка заявки</span><select class="inp" style="width: 210px; height: 32px; font-size: 13px; padding: 0 10px; {{convRoute.selStyle}}" value="{{convRoute.sel}}" onChange="{{convRoute.onSel}}"><option value="" disabled>Выберите воронку</option><option value="group" disabled="{{convRoute.offG}}">Групповые туры{{convRoute.recG}}</option><option value="package" disabled="{{convRoute.offP}}">Пакетные туры{{convRoute.recP}}</option><option value="base">Базовая воронка{{convRoute.recB}}</option></select></label>
</div></sc-if>
<div style="padding: 20px; display: flex; flex-direction: column; gap: 10px; background: #FAFAFB; flex: 1">
<div class="badge" style="align-self: center; background: #EFF0F2; color: #5A606B">Сегодня</div>
<sc-for list="{{msgs}}" as="mm" hint-placeholder-count="3">
<div style="{{mm.wrap}}"><div style="{{mm.bubble}}"><sc-if value="{{mm.auto}}" hint-placeholder-val="{{ false }}"><div style="font-size: 11px; font-weight: 600; margin-bottom: 4px; opacity: 0.85">Автоответ</div></sc-if><div>{{mm.text}}</div><div class="num" style="font-size: 11px; margin-top: 4px; text-align: right; {{mm.timeStyle}}">{{mm.time}}</div></div></div>
</sc-for>
</div>
<div style="padding: 12px 20px 16px; border-top: 1px solid #F0F1F3; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center"><span class="cap" style="margin-right: 4px">Шаблоны:</span><sc-for list="{{quick}}" as="q" hint-placeholder-count="3"><button class="btn btn-sm" onClick="{{q.pick}}">{{q.label}}</button></sc-for><a class="lnk" style="margin-left: auto; font-size: 13px; text-decoration: none" href="{{conv.waLink}}" target="_blank" rel="noopener">Открыть чат в {{conv.src}} ↗</a></div>
<div style="display: flex; gap: 8px; align-items: flex-end"><label style="flex: 1"><span class="sr">Ответ клиенту</span><textarea class="inp" style="height: 64px; padding: 10px 12px; resize: vertical; line-height: 1.5" value="{{draft}}" onChange="{{onDraft}}" placeholder="Ответ клиенту — уйдёт в {{conv.src}} с номера агентства"></textarea></label><button class="btn btn-p" style="height: 40px" onClick="{{send}}">Отправить</button></div>
<div class="cap">Ответ сохранится в переписке и в истории заявки. Клиент получит его в {{conv.src}}.</div>
</div>
</div>
<div style="flex: 1 1 260px; max-width: 100%; border-left: 1px solid #E6E7EA; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box">
<div class="h2">Данные лида</div>
<p class="cap" style="margin: 0; line-height: 1.5">Уточните в переписке — при создании заявки поля перенесутся.</p>
<label class="field"><span class="lbl">Направление</span><input class="inp" value="{{lead.dir}}" onChange="{{lead.onDir}}"></label>
<label class="field"><span class="lbl">Дата поездки</span><input class="inp" value="{{lead.date}}" onChange="{{lead.onDate}}"></label>
<label class="field"><span class="lbl">Количество человек</span><input class="inp" inputmode="numeric" value="{{lead.people}}" onChange="{{lead.onPeople}}"></label>
<label class="field"><span class="lbl">Виза</span><select class="inp" value="{{lead.visa}}" onChange="{{lead.onVisa}}"><option>Нет</option><option>Нет, оформляем</option><option>Шенген был в 2024</option><option>Шенген был в 2025</option><option>Не нужна</option></select></label>
<div style="padding-top: 10px; border-top: 1px solid #F0F1F3" class="kv"><span>Источник</span><span>{{conv.src}}</span></div>
</div>
</div>
</section>
</sc-if>

<sc-if value="{{isDeals}}" hint-placeholder-val="{{ false }}">
<section style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: flex-end">
<div><h1 class="h1">Заявки</h1><p class="sub" style="margin-top: 4px">{{dealsSub}}</p></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
<div class="segw"><sc-for list="{{pipeTabs}}" as="p" hint-placeholder-count="2"><button class="seg" style="{{p.style}}" onClick="{{p.pick}}">{{p.label}}</button></sc-for></div>

<div class="th" style="grid-template-columns: 1.3fr 2fr 1.7fr 1fr 0.9fr 40px"><div>Направление</div><div>Ключевые слова</div><div>Ответственные</div><div>Режим</div><div>Резерв</div><div></div></div>
<sc-for list="{{dirRows}}" as="dr" hint-placeholder-count="4"><div class="tr" style="grid-template-columns: 1.3fr 2fr 1.7fr 1fr 0.9fr 40px; align-items: start"><div><div style="font-weight: 600">{{dr.name}}</div><sc-if value="{{dr.warn}}" hint-placeholder-val="{{ false }}"><div class="cap" style="color: #B54708; margin-top: 4px">{{dr.warnText}}</div></sc-if></div><div><label><span class="sr">Ключевые слова</span><input class="inp" style="height: 34px; font-size: 13px" value="{{dr.kw}}" onChange="{{dr.onKw}}"></label></div><div style="display: flex; gap: 4px; flex-wrap: wrap"><sc-for list="{{dr.mgrChips}}" as="ch" hint-placeholder-count="3"><button class="btn btn-sm" style="height: 28px; font-size: 12.5px; {{ch.style}}" onClick="{{ch.pick}}">{{ch.label}}</button></sc-for></div><div><div class="segw"><sc-for list="{{dr.modeTabs}}" as="sg" hint-placeholder-count="2"><button class="seg" style="font-size: 12.5px; {{sg.style}}" onClick="{{sg.pick}}">{{sg.label}}</button></sc-for></div></div><div><label><span class="sr">Резерв</span><select class="inp" style="height: 34px; font-size: 13px" value="{{dr.backup}}" onChange="{{dr.onBackup}}"><option>Ерлан</option><option>Аягөз</option><option>Дана</option></select></label></div><div><button class="btn btn-sm btn-g" aria-label="Удалить направление" onClick="{{dr.del}}">✕</button></div></div></sc-for>
</div></div>
<div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end"><label class="field" style="flex: 1 1 260px; max-width: 420px"><span class="lbl">Новое направление</span><input class="inp" value="{{newDirName}}" onChange="{{onNewDirName}}" placeholder="Например: Грузия"></label><button class="btn btn-p" onClick="{{addDir}}">Добавить</button><label class="field" style="margin-left: auto"><span class="lbl">Если направление не определено</span><select class="inp" style="width: 220px" value="{{dirDefault}}" onChange="{{onDirDefault}}"><option>Ерлан</option><option>Аягөз</option><option>Дана</option></select></label></div>
<div style="display: flex; flex-wrap: wrap; gap: 16px">
<div class="card cp" style="flex: 1 1 340px; display: flex; flex-direction: column; gap: 10px"><div class="h2">Доступность сотрудников</div><sc-for list="{{vacRows}}" as="vr2" hint-placeholder-count="3"><div style="display: flex; gap: 10px; align-items: center"><span class="av" style="width: 28px; height: 28px; font-size: 11px; background: #E0E7FF; color: #3538CD">{{vr2.ini}}</span><span style="flex: 1; font-weight: 500">{{vr2.name}}</span><span class="badge" style="{{vr2.style}}">{{vr2.label}}</span><button role="switch" aria-checked="{{vr2.on}}" aria-label="Принимает заявки" style="width: 40px; height: 22px; border-radius: 11px; border: 0; padding: 2px; cursor: pointer; {{vr2.track}}" onClick="{{vr2.toggle}}"><span style="display: block; width: 18px; height: 18px; border-radius: 9px; background: #FFFFFF; transition: transform .15s; {{vr2.knob}}"></span></button></div></sc-for></div>
<div class="card cp" style="flex: 1 1 340px; display: flex; flex-direction: column; gap: 10px"><div class="h2">Проверить распределение</div><label><span class="sr">Текст обращения</span><input class="inp" value="{{dirTest}}" onChange="{{onDirTest}}" placeholder="Например: хотим в Анталью в январе"></label><sc-if value="{{hasDirTest}}" hint-placeholder-val="{{ false }}"><div style="padding: 10px 12px; border-radius: 8px; background: #F9FAFB; font-weight: 500">{{dirTestText}}</div></sc-if></div>
</div>
</div>
</sc-if>
<sc-if value="{{setRouting}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px; max-width: 1100px">
<p class="sub">Правила проверяются по порядку: 1) метка из ссылки, 2) канал, 3) ключевые слова в первом сообщении. Менеджер видит подсказку и может выбрать другую воронку при создании заявки.</p>
<div class="card"><div style="padding: 14px 20px; border-bottom: 1px solid #F0F1F3"><div class="h2">1. Ссылки с меткой</div><div class="cap" style="margin-top: 2px">Поставьте ссылку на кнопку на сайте или в Instagram — клиент откроет WhatsApp с готовым текстом и меткой, заявка сразу попадёт в нужную воронку</div></div>
<div style="overflow-x: auto"><div style="min-width: 820px">
<div class="th" style="grid-template-columns: 1.8fr 0.8fr 1.2fr 1.2fr 0.9fr"><div>Кнопка</div><div>Метка</div><div>Воронка</div><div>Привязка</div><div></div></div>
<sc-for list="{{rtLinkRows}}" as="lk" hint-placeholder-count="3"><div class="tr" style="grid-template-columns: 1.8fr 0.8fr 1.2fr 1.2fr 0.9fr"><div style="font-weight: 500">{{lk.label}}</div><div><code style="font-size: 12px; color: #3538CD">{{lk.tag}}</code></div><div><span class="badge" style="{{lk.pStyle}}">{{lk.pipe}}</span></div><div class="cap">{{lk.dep}}</div><div style="display: flex; gap: 4px; justify-content: flex-end"><button class="btn btn-sm" onClick="{{lk.copy}}">Копировать ссылку</button><button class="btn btn-sm btn-g" aria-label="Удалить" onClick="{{lk.del}}">✕</button></div></div></sc-for>
</div></div>
<div style="padding: 14px 20px; border-top: 1px solid #F0F1F3; display: flex; flex-direction: column; gap: 10px"><div class="lbl">Новая ссылка</div><div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center"><label style="flex: 1 1 260px"><span class="sr">Текст кнопки</span><input class="inp" value="{{newTagLabel}}" onChange="{{onNewTagLabel}}" placeholder="Текст кнопки, например: Хочу в Грузию"></label><div class="segw"><sc-for list="{{newTagPipeTabs}}" as="sg" hint-placeholder-count="3"><button class="seg" style="{{sg.style}}" onClick="{{sg.pick}}">{{sg.label}}</button></sc-for></div><button class="btn btn-p" onClick="{{addTag}}">Создать ссылку</button></div>
<sc-if value="{{newTagIsGroup}}" hint-placeholder-val="{{ true }}"><div style="display: flex; gap: 6px; flex-wrap: wrap; align-items: center"><span class="cap">Привязать к выезду:</span><sc-for list="{{newTagDepChips}}" as="ch" hint-placeholder-count="3"><button class="btn btn-sm" style="{{ch.style}}" onClick="{{ch.pick}}">{{ch.label}}</button></sc-for></div></sc-if></div>
</div>
<div class="card"><div style="padding: 14px 20px; border-bottom: 1px solid #F0F1F3"><div class="h2">2. Каналы</div><div class="cap" style="margin-top: 2px">Если канал всегда ведёт в одну воронку — задайте её. Иначе система определит воронку по тексту.</div></div>
<sc-for list="{{rtChanRows}}" as="cr2" hint-placeholder-count="3"><div class="tr" style="grid-template-columns: 1fr 1.4fr"><div style="font-weight: 600">{{cr2.ch}}</div><div><label><span class="sr">Воронка для {{cr2.ch}}</span><select class="inp" style="max-width: 320px" value="{{cr2.val}}" onChange="{{cr2.set}}"><option value="auto">По тексту сообщения</option><option value="group">Групповые туры</option><option value="package">Пакетные туры</option><option value="base">Базовая воронка</option></select></label></div></div></sc-for>
</div>
<div class="card"><div style="padding: 14px 20px; border-bottom: 1px solid #F0F1F3"><div class="h2">3. Ключевые слова в первом сообщении</div><div class="cap" style="margin-top: 2px">Через запятую, можно писать начало слова: «анталь» найдёт «Анталья» и «Анталию». Названия выездов из плана тоже учитываются.</div></div>
<div style="padding: 16px 20px; display: flex; flex-direction: column; gap: 12px"><sc-for list="{{rtKwRows}}" as="kw" hint-placeholder-count="3"><label class="field"><span><span class="badge" style="{{kw.style}}">{{kw.label}}</span></span><textarea class="inp" style="height: 54px; padding: 8px 12px; resize: vertical; line-height: 1.5" value="{{kw.val}}" onChange="{{kw.set}}"></textarea></label></sc-for></div>
</div>
<div class="card cp" style="display: flex; flex-direction: column; gap: 12px"><div class="h2">Если воронка не определилась</div><div class="segw" style="align-self: flex-start"><button class="seg" style="{{rtFbQueue}}" onClick="{{setFbQueue}}">В очередь «Без воронки»</button><button class="seg" style="{{rtFbBase}}" onClick="{{setFbBase}}">В базовую воронку</button></div></div>
<div class="card cp" style="display: flex; flex-direction: column; gap: 10px"><div class="h2">Проверить правила</div><label><span class="sr">Текст сообщения</span><input class="inp" value="{{rtTest}}" onChange="{{onRtTest}}" placeholder="Вставьте текст сообщения клиента, например: хотим в Египет, всё включено"></label><sc-if value="{{hasRtTest}}" hint-placeholder-val="{{ false }}"><div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap"><span class="cap">Результат:</span><span class="badge" style="{{rtTestStyle}}">{{rtTestPipe}}</span><span class="cap">{{rtTestHow}}</span></div></sc-if></div>
</div>
</sc-if>
<sc-if value="{{setCompany}}" hint-placeholder-val="{{ false }}">

<div style="padding: 16px 20px; border-bottom: 1px solid #F0F1F3"><div class="h2">Реквизиты турагентства</div><div class="sub" style="margin-top: 2px">Подставляются в договоры через переменные {company_name}, {company_bin} и другие.</div></div>

<div style="padding: 14px 20px; border-top: 1px solid #F0F1F3; display: flex; justify-content: flex-end"><button class="btn btn-p" onClick="{{saveCompany}}">Сохранить реквизиты</button></div>
</div>
</sc-if>
<sc-if value="{{setContracts}}" hint-placeholder-val="{{ false }}">

</div>
<sc-if value="{{tplEditing}}" hint-placeholder-val="{{ false }}">

</div>
<div class="field"><span class="lbl">3. Документ</span>

</div>
<sc-if value="{{tdParsed}}" hint-placeholder-val="{{ false }}">

any_iik">Компания: ИИК</option><option value="company_bik">Компания: БИК</option><option value="company_license">Компания: Лицензия</option><option value="company_phone">Компания: Телефон компании</option></select></label></div><div style="font-size: 13px; {{tv.sampleStyle}}">{{tv.sample}}</div></div></sc-for>
</div></div></div>

</sc-if>

<div style="padding: 14px 20px; border-top: 1px solid #F0F1F3; display: flex; gap: 8px; justify-content: flex-end"><button class="btn" onClick="{{tplCancel}}">Отмена</button><button class="btn btn-p" onClick="{{saveTplEdit}}">Сохранить шаблон</button></div>

<sc-if value="{{modalPayment}}" hint-placeholder-val="{{ false }}">

<sc-if value="{{ts.isLinked}}" hint-placeholder-val="{{ false }}"><div class="badge" style="height: auto; padding: 10px 12px; white-space: normal; line-height: 1.5; background: #EEF4FF; color: #2D31A6">{{ts.linkedNote}}</div></sc-if>
<div style="display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 12px 14px; align-items: center">
<span class="lbl">Приоритет</span><div class="segw" style="justify-self: start"><sc-for list="{{ts.prTabs}}" as="sg" hint-placeholder-count="3"><button class="seg" style="{{sg.style}}" onClick="{{sg.pick}}">{{sg.label}}</button></sc-for></div>
<span class="lbl">Исполнитель</span><label><span class="sr">Исполнитель</span><select class="inp" style="max-width: 220px" value="{{ts.who}}" onChange="{{tsH.onWho}}"><option>Ерлан</option><option>Аягөз</option><option>Дана</option></select></label>
<span class="lbl">Срок</span><div style="display: flex; gap: 8px; max-width: 320px"><label style="flex: 1"><span class="sr">Дата</span><input class="inp" type="date" value="{{ts.dueIso}}" onChange="{{tsH.onDue}}"></label><label style="width: 110px"><span class="sr">Время</span><input class="inp" type="time" value="{{ts.time}}" onChange="{{tsH.onTime}}"></label></div>
<span class="lbl">Связь</span><div><sc-if value="{{ts.hasLink}}" hint-placeholder-val="{{ false }}"><button class="lnk" onClick="{{ts.openLink}}">{{ts.linkLabel}} →</button></sc-if><sc-if value="{{tsNoLink}}" hint-placeholder-val="{{ true }}"><span class="cap">Без привязки</span></sc-if></div>
<span class="lbl">Автор</span><span>{{ts.author}}</span>
</div>
<sc-if value="{{ts.isSys}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; gap: 4px"><span class="lbl">Что сделать на этапе</span><div style="line-height: 1.55; color: #3A3F48">{{ts.sysDesc}}</div></div>
<sc-if value="{{ts.sysCurrent}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column"><div style="display: flex; justify-content: space-between; margin-bottom: 2px"><span class="lbl">Вводные данные и обязательные действия</span><span class="cap num">{{spv.progress}}</span></div>
<div class="cap" style="margin-bottom: 4px; line-height: 1.45">{{spv.hint}}</div>
<sc-for list="{{reqItems}}" as="ri" hint-placeholder-count="3">
<div style="display: flex; gap: 12px; padding: 12px 0; margin: 6px 0; align-items: flex-start; {{ri.rowStyle}}">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap"><span style="font-weight: 500; {{ri.labelStyle}}">{{ri.label}}</span><span class="badge" style="background: #F2F3F5; color: #3A3F48">{{ri.typeLabel}}</span><sc-if value="{{ri.done}}" hint-placeholder-val="{{ false }}"><span class="badge" style="background: #ECFDF3; color: #067647">✓ Выполнено</span></sc-if><sc-if value="{{ri.reqOpen}}" hint-placeholder-val="{{ true }}"><span class="badge" style="background: #FEF3F2; color: #B42318">обязательно</span></sc-if></div>

<sc-if value="{{ri.isPay}}" hint-placeholder-val="{{ false }}"><div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap"><span class="cap num">{{ri.payText}}</span><sc-if value="{{ri.notDone}}" hint-placeholder-val="{{ false }}"><button class="btn btn-sm" onClick="{{openPayment}}">Принять оплату</button></sc-if></div></sc-if>
<sc-if value="{{ri.isComment}}" hint-placeholder-val="{{ false }}"><sc-if value="{{ri.done}}" hint-placeholder-val="{{ false }}"><div style="padding: 10px 12px; border-radius: 8px; background: #FFFAEB; color: #3A3F48; line-height: 1.5">{{ri.noteText}}</div></sc-if><sc-if value="{{ri.notDone}}" hint-placeholder-val="{{ true }}"><div style="display: flex; gap: 8px; align-items: flex-start"><label style="flex: 1"><span class="sr">{{ri.label}}</span><textarea class="inp" style="height: 64px; padding: 8px 12px; resize: vertical; line-height: 1.45" value="{{ri.val}}" onChange="{{ri.onInput}}" placeholder="Комментарий сохранится в истории заявки"></textarea></label><button class="btn btn-sm" style="height: 36px" onClick="{{ri.save}}">Сохранить</button></div></sc-if></sc-if>
<sc-if value="{{ri.isCheck}}" hint-placeholder-val="{{ false }}"><button class="btn btn-sm" style="{{ri.checkStyle}}; align-self: flex-start" onClick="{{ri.toggle}}">{{ri.checkLabel}}</button></sc-if>

<sc-if value="{{ri.isClient}}" hint-placeholder-val="{{ false }}"><div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap"><span class="cap">{{ri.clientText}}</span><button class="btn btn-sm" onClick="{{openClient}}">Заполнить данные клиента</button></div></sc-if>
<sc-if value="{{ri.isTravelers}}" hint-placeholder-val="{{ false }}"><div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap"><span class="cap">{{ri.travText}}</span><button class="btn btn-sm" onClick="{{openTraveler}}">Добавить туриста</button></div></sc-if>
<sc-if value="{{ri.isEvent}}" hint-placeholder-val="{{ false }}"><div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap"><span class="cap">{{ri.evText}}</span><sc-if value="{{ri.notDone}}" hint-placeholder-val="{{ false }}"><button class="btn btn-sm" onClick="{{ri.planVisa}}">Запланировать запись</button></sc-if></div></sc-if>
</div>
</div>
</sc-for>
</div></sc-if>
<sc-if value="{{ts.sysPast}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; gap: 6px"><span class="lbl">Действия этапа</span><sc-for list="{{ts.sysReqs}}" as="sq" hint-placeholder-count="3"><div style="display: flex; gap: 10px; align-items: center"><sc-if value="{{sq.d}}" hint-placeholder-val="{{ true }}"><span class="badge" style="background: #ECFDF3; color: #067647">✓</span></sc-if><span>{{sq.t}}</span></div></sc-for></div></sc-if>
</sc-if>
<sc-if value="{{ts.notSys}}" hint-placeholder-val="{{ true }}">

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between"><span class="lbl">Подзадачи</span><span class="cap num">{{ts.subsText}}</span></div>
<sc-for list="{{ts.subs}}" as="sb" hint-placeholder-count="2"><div style="display: flex; gap: 10px; align-items: center; padding: 6px 0"><button aria-label="Отметить подзадачу" style="{{sb.box}}" onClick="{{sb.toggle}}"><sc-if value="{{sb.d}}" hint-placeholder-val="{{ false }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 12px; height: 12px; color: #FFFFFF; stroke-width: 3"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></button><span style="flex: 1; {{sb.style}}">{{sb.t}}</span><button class="btn btn-sm btn-g" style="height: 26px" aria-label="Удалить подзадачу" onClick="{{sb.del}}">✕</button></div></sc-for>

</div>
</sc-if>
<sc-if value="{{ts.hasResult}}" hint-placeholder-val="{{ false }}"><div style="padding: 12px 14px; border-radius: 10px; background: #ECFDF3; border: 1px solid #ABEFC6; display: flex; flex-direction: column; gap: 4px"><span class="lbl" style="color: #067647">Результат выполнения</span><span style="line-height: 1.5; white-space: pre-line">{{ts.result}}</span></div></sc-if>
<div style="display: flex; flex-direction: column; gap: 6px"><span class="lbl">История</span><sc-for list="{{ts.log}}" as="lgi" hint-placeholder-count="2"><div style="display: flex; gap: 10px; font-size: 13px"><span class="cap num" style="width: 82px; flex: 0 0 82px">{{lgi.t}}</span><span>{{lgi.text}}</span></div></sc-for></div>
</div>
<div style="padding: 14px 20px; border-top: 1px solid #F0F1F3; display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap">
<sc-if value="{{confirmDel}}" hint-placeholder-val="{{ false }}"><div style="display: flex; gap: 8px; align-items: center"><span style="font-weight: 500; color: #B42318">Удалить задачу?</span><button class="btn btn-sm" onClick="{{tsH.cancelDel}}">Нет</button><button class="btn btn-sm" style="background: #D92D20; border-color: #D92D20; color: #FFFFFF" onClick="{{tsH.del}}">Удалить</button></div></sc-if>
<sc-if value="{{noConfirmDel}}" hint-placeholder-val="{{ true }}"><sc-if value="{{ts.canDelete}}" hint-placeholder-val="{{ true }}"><button class="btn btn-sm btn-g btn-d" onClick="{{tsH.askDel}}">Удалить</button></sc-if><sc-if value="{{ts.isSys}}" hint-placeholder-val="{{ false }}"><span class="cap">Системную задачу нельзя удалить</span></sc-if></sc-if>
<sc-if value="{{ts.isTodo}}" hint-placeholder-val="{{ true }}"><button class="btn btn-p" onClick="{{tsH.take}}">Взять в работу</button></sc-if>
<sc-if value="{{tsReopen}}" hint-placeholder-val="{{ false }}"><button class="btn" onClick="{{tsH.reopen}}">Вернуть в работу</button></sc-if>
<sc-if value="{{tsSysFinish}}" hint-placeholder-val="{{ false }}"><button class="btn btn-p" style="{{spv.ctaStyle}}" onClick="{{spv.complete}}">{{spv.sysCta}}</button></sc-if>
</div>
<sc-if value="{{tsManualProgress}}" hint-placeholder-val="{{ false }}">
<div style="padding: 14px 20px 18px; border-top: 1px solid #F0F1F3; background: #FAFAFF; display: flex; flex-direction: column; gap: 10px">
<label class="field"><span class="lbl">Результат выполнения <span style="color: #B42318">*</span></span><textarea class="inp" style="height: 80px; padding: 10px 12px; resize: vertical; line-height: 1.5" value="{{tsH.resultInput}}" onChange="{{tsH.onResult}}" placeholder="Что сделано: например, клиент записан на 27.10 в 10:30, документы проверены"></textarea></label>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap"><span class="cap">Результат увидят автор задачи и руководитель</span><button class="btn btn-p" onClick="{{tsH.finish}}">Завершить задачу</button></div>
</div>
</sc-if>
</div>
</div>
</sc-if>
<sc-if value="{{mClient}}" hint-placeholder-val="{{ false }}">
<div style="position: fixed; inset: 0; background: rgba(15, 17, 21, 0.45); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 50; overflow-y: auto; box-sizing: border-box">

</div>

</div>

</div>

<div role="dialog" aria-modal="true" aria-label="Подписание документа" style="width: 100%; max-width: 620px; background: #FFFFFF; border-radius: 20px; padding: 40px 32px 44px; box-sizing: border-box; position: relative; text-align: center">
<button class="btn btn-g btn-ico" style="position: absolute; top: 14px; right: 14px" aria-label="Закрыть" onClick="{{spv2.close}}">✕</button>
<div style="font-size: 22px; font-weight: 600; color: #344054">Подписание документа</div><div style="font-size: 14px; color: #667085; margin-top: 6px">Выберите способ подписания</div>
<div style="display: flex; gap: 24px; justify-content: center; margin-top: 30px; flex-wrap: wrap">
<button style="width: 216px; height: 262px; border: 0; border-radius: 20px; background: linear-gradient(135deg, #F2F4F7, #E4E9F2); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; font-family: 'Open Sans', Inter, system-ui, sans-serif; font-size: 15px; font-weight: 600; color: #344054" onClick="{{spv2.toEcp}}"><svg viewBox="0 0 64 64" aria-hidden="true" style="width: 96px; height: 96px; fill: none; stroke: #475467; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round"><circle cx="40" cy="22" r="13"></circle><path d="M30 31 10 51l4 4 4-4 4 4 4-4-3-3 9-9"></path><path d="m36 18 8 8"></path></svg>Через ЭЦП</button>
<button style="width: 216px; height: 262px; border: 0; border-radius: 20px; background: linear-gradient(135deg, #F2F4F7, #E4E9F2); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; font-family: 'Open Sans', Inter, system-ui, sans-serif; font-size: 15px; font-weight: 600; color: #344054; line-height: 1.4" onClick="{{spv2.toEgov}}"><svg viewBox="0 0 64 64" aria-hidden="true" style="width: 96px; height: 96px; fill: none; stroke: #475467; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round"><rect x="8" y="8" width="18" height="18" rx="3"></rect><rect x="38" y="8" width="18" height="18" rx="3"></rect><rect x="8" y="38" width="18" height="18" rx="3"></rect><path d="M32 8v8M32 24v6M38 38h4M48 38h8M38 48v8M48 48h8v8"></path></svg><span>Через eGov Mobile<br>(QR)</span></button>
</div>
</div>
</div>
</sc-if>
<sc-if value="{{spv2.isEcp}}" hint-placeholder-val="{{ false }}">
<div style="position: fixed; inset: 0; background: rgba(16, 24, 40, 0.45); z-index: 56; overflow: auto">
<div style="position: absolute; right: 8%; top: 24%; width: 520px; max-width: calc(100% - 32px); height: 470px; background: #FFFFFF; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; box-shadow: 0 24px 48px rgba(16,24,40,0.2)"><div style="font-size: 26px; font-weight: 600; color: #344054">Подписание с помощью ЭЦП</div><svg viewBox="0 0 50 50" aria-hidden="true" style="width: 150px; height: 150px"><circle cx="25" cy="25" r="20" fill="none" stroke="#1E63F0" stroke-width="4" stroke-linecap="round" stroke-dasharray="94 32"><animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1.1s" repeatCount="indefinite"></animateTransform></circle></svg><div style="font-size: 15px; color: #344054">Ожидание подписания…</div></div>
<div role="dialog" aria-modal="true" aria-label="NCALayer" style="position: absolute; left: 6%; top: 12%; width: 680px; max-width: calc(100% - 32px); background: #F5F7FA; border: 1px solid #D0D5DD; border-radius: 8px; box-shadow: 0 16px 40px rgba(16,24,40,0.3); font-family: 'Segoe UI', Inter, system-ui, sans-serif; color: #1D2939; overflow: hidden">
<div style="height: 42px; background: #F7F9E8; display: flex; align-items: center; justify-content: space-between; padding: 0 6px 0 14px"><div style="display: flex; gap: 8px; align-items: center; font-size: 15px"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><circle cx="12" cy="8" r="5" fill="#1E63F0"></circle><path d="M12 13v9" stroke="#1E63F0" stroke-width="3"></path><circle cx="12" cy="8" r="2" fill="#F5C518"></circle></svg>NCALayer</div><button class="btn btn-g btn-ico" style="width: 40px; height: 34px" aria-label="Закрыть NCALayer" onClick="{{spv2.close}}">✕</button></div>
<div style="padding: 26px 32px 30px; display: flex; flex-direction: column; gap: 18px">
<div style="font-size: 22px; text-align: center; color: #344054">{{spv2.origin}} запрашивает разрешение</div>
<div style="display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px 18px; align-items: center; font-size: 15px">
<span>Действие</span><span style="color: #D92D20">Подписание</span>
<span></span><button class="lnk" style="color: #1570EF; font-size: 15px" onClick="{{spv2.close}}">Просмотр подписываемых данных</button>
<span>Тип хранилища</span><div style="display: flex; gap: 8px"><label style="flex: 1"><span class="sr">Тип хранилища</span><select class="inp" style="height: 36px; border: 2px solid #1570EF; border-radius: 4px" value="{{spv2.store}}" onChange="{{spv2.onStore}}"><option>Персональный компьютер</option><option>Казтокен</option><option>Удостоверение личности</option></select></label><button class="btn btn-ico" style="background: #1570EF; border-color: #1570EF; color: #FFFFFF; border-radius: 4px" aria-label="Обновить">⟳</button></div>
<sc-if value="{{spv2.isPc}}" hint-placeholder-val="{{ true }}"><span>Место хранения</span></sc-if><sc-if value="{{spv2.isPc}}" hint-placeholder-val="{{ true }}"><div style="display: flex; gap: 8px"><label style="flex: 1; min-width: 0"><span class="sr">Место хранения</span><input class="inp" style="height: 36px; border-radius: 4px" readonly value="{{spv2.path}}" placeholder="Выберите файл ключа .p12"></label><button class="btn btn-ico" style="background: #1570EF; border-color: #1570EF; color: #FFFFFF; border-radius: 4px" aria-label="Выбрать файл ключа" onClick="{{spv2.pickPath}}"><svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true" style="fill: #FFFFFF; stroke: none"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></button></div></sc-if>
<span>Пароль</span><div style="display: flex; gap: 8px; max-width: 320px"><label style="flex: 1"><span class="sr">Пароль</span><input class="inp" style="height: 36px; border-radius: 4px" type="{{spv2.passType}}" value="{{spv2.pass}}" onChange="{{spv2.onPass}}"></label><button class="btn btn-ico" style="background: #1570EF; border-color: #1570EF; color: #FFFFFF; border-radius: 4px" aria-label="Показать пароль" onClick="{{spv2.toggleEye}}"><svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></div>
</div>
<sc-if value="{{hasFErr}}" hint-placeholder-val="{{ false }}"><div style="color: #B42318; text-align: center; font-size: 14px">{{fErr}}</div></sc-if>
<div style="display: flex; gap: 30px; justify-content: center; margin-top: 4px"><button class="btn" style="width: 150px; height: 40px; border-radius: 4px; {{spv2.openStyle}}" onClick="{{spv2.ecpOpen}}">Открыть</button><button class="btn" style="width: 150px; height: 40px; border-radius: 4px; border-color: #667085" onClick="{{spv2.close}}">Отмена</button></div>
<div style="font-size: 12px; color: #667085; text-align: center">Демо: нажмите на папку, введите любой пароль от 4 символов и нажмите «Открыть»</div>
</div>
</div>
</div>
</sc-if>
<sc-if value="{{spv2.isEgov}}" hint-placeholder-val="{{ false }}">
<div style="position: fixed; inset: 0; background: rgba(16, 24, 40, 0.45); z-index: 56; display: flex; align-items: center; justify-content: center; padding: 16px">
<div role="dialog" aria-modal="true" aria-label="Подписание через eGov Mobile" style="width: 100%; max-width: 620px; background: #FFFFFF; border-radius: 20px; padding: 40px 32px; box-sizing: border-box; position: relative; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 28px">
<button class="btn btn-g btn-ico" style="position: absolute; top: 14px; right: 14px" aria-label="Закрыть" onClick="{{spv2.close}}">✕</button>
<div style="font-size: 26px; font-weight: 600; color: #344054">Подписание через eGov Mobile</div>
<div style="position: relative; width: max-content"><div style="display: grid; grid-template-columns: repeat(21, 8px); background: #FFFFFF"><sc-for list="{{qrCells}}" as="q" hint-placeholder-count="441"><span style="width: 8px; height: 8px; {{q.s}}"></span></sc-for></div><span style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 44px; height: 44px; border-radius: 6px; background: #344054; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; border: 3px solid #FFFFFF">T</span></div>
<div style="font-size: 15px; color: #475467; line-height: 1.7">1. Откройте приложение eGov Mobile<br>2. Откройте сканер QR-кодов<br>3. Отсканируйте QR-код</div>
<button class="btn btn-sm btn-g" onClick="{{spv2.egovDone}}">Демо: отсканировано и подписано в eGov Mobile</button>
</div>
</div>
</sc-if>
</div>
</sc-if>
<sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px; max-width: 520px; width: calc(100% - 32px); box-sizing: border-box; background: #0F1115; color: #FFFFFF; padding: 12px 16px; border-radius: 10px; font-size: 13.5px; line-height: 1.45; z-index: 60; box-shadow: 0 12px 32px rgba(16,24,40,0.3); display: flex; gap: 10px; align-items: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: #32D583"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><path d="m22 4-10 10.01-3-3"></path></svg><span style="flex: 1">{{toast}}</span><button class="lnk" style="color: #A4BCFD; font-size: 13px" onClick="{{hideToast}}">Закрыть</button></div>
</sc-if>

</div>
</sc-if>
